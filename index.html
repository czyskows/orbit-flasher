<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Firmware Updater</title>
    <style>
      :root {
        --bg: #10131a; --panel: #1a1f2b; --panel2: #222836;
        --text: #e8ecf4; --dim: #93a0b8; --dim2: #6b7688;
        --accent: #ffa63d; --ok: #4cd97b; --err: #ff5d5d; --line: #313a4d;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--bg); color: var(--text);
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        padding: 32px 16px;
      }
      h1 { font-size: 22px; letter-spacing: 0.04em; margin-bottom: 4px; }
      .sub { color: var(--dim2); margin-bottom: 28px; font-size: 13px; }
      .wrap { width: 100%; max-width: 680px; }
      .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
      .step h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim2); margin-bottom: 12px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .card {
        background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
        padding: 14px; cursor: pointer; text-align: left; color: var(--text); font: inherit;
      }
      .card:hover { border-color: var(--accent); }
      .card.sel { border-color: var(--accent); outline: 1px solid var(--accent); }
      .card small { display: block; color: var(--dim2); margin-top: 4px; font-size: 12px; }
      .help { color: #b8c2d4; background: var(--panel2); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 6px 6px 0; margin: 10px 0; font-size: 14px; }
      button.primary {
        background: var(--accent); color: #14100a; border: 0; border-radius: 8px;
        font: 600 15px system-ui; padding: 10px 22px; cursor: pointer;
      }
      button.primary:disabled { opacity: 0.35; cursor: default; }
      input[type="file"] { color: var(--dim2); }
      .filemsg { margin-top: 8px; font-size: 13px; }
      .filemsg.ok { color: var(--ok); }
      .filemsg.err { color: var(--err); }
      .bar { height: 10px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin: 12px 0 6px; }
      .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s; }
      .pmsg { font-size: 13px; color: var(--dim2); }
      .result { font-size: 15px; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; }
      .result.ok { display: block; background: rgba(76, 217, 123, 0.08); border: 1px solid rgba(76, 217, 123, 0.4); }
      .result.err { display: block; background: rgba(255, 93, 93, 0.08); border: 1px solid rgba(255, 93, 93, 0.4); }
      details { margin-top: 16px; width: 100%; max-width: 680px; }
      summary { color: var(--dim2); cursor: pointer; font-size: 13px; }
      #log {
        background: #0b0e13; border: 1px solid var(--line); border-radius: 8px;
        font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9fb0c8;
        padding: 10px; margin-top: 8px; height: 200px; overflow-y: auto; white-space: pre-wrap;
      }
      .unsupported { background: rgba(255, 93, 93, 0.08); border: 1px solid rgba(255, 93, 93, 0.4); border-radius: 8px; padding: 14px; margin-bottom: 16px; display: none; }
    </style>

    <h1>ORBIT FIRMWARE UPDATER</h1>
    <div class="sub">Orbit &middot; Ground Control &mdash; browser flasher (Chrome or Edge)</div>

    <div class="wrap">
      <div class="unsupported" id="unsupported">

      <div class="step" id="step-board">
        <h2>1 &middot; Which board?</h2>
        <div class="cards" id="board-cards"></div>
      </div>

        <input type="file" id="file" accept=".bin" />
        <div class="filemsg" id="filemsg"></div>
      </div>

      <div class="step" id="step-connect" style="display:none">
        <h2>3 &middot; Connect &amp; flash</h2>

        <div class="bar" style="display:none" id="bar"><div id="barfill"></div></div>
        <div class="pmsg" id="pmsg"></div>
        <div class="result" id="result"></div>
      </div>
    </div>

    <details>
      <summary>Technical log</summary>
      <div id="log"></div>
    </details>

  </body>
</html>
